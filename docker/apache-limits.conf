# Keep Apache from starting more PHP processes than the VPS can hold.
# Extra requests wait in the queue instead of exhausting memory.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          5
    MaxRequestWorkers       15
    MaxConnectionsPerChild 500
</IfModule>

# Free idle keep-alive connections quickly so they don't hold a worker.
KeepAliveTimeout 2
